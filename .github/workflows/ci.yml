name: CI

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Source
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Verify FastAPI
              run: |
                  python -c "from app.main import app; print('FastAPI import success!')"
            - name: Ruff Lint
              run: |
                  ruff check .
            - name: Run Tests
              run: |
                  python -m pytest
